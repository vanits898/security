name: Daily Python Automation

on:
  schedule:
    # ⏱️ ตั้งเวลาให้รันทุกวันตอน 7 โมงเช้าเวลาไทย (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # เปิดปุ่มให้เราสามารถกดสั่งรันเองแบบ Manual ได้ด้วย

jobs:
  run-python-job:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true # 👈 ดึงไฟล์โมเดลขนาดใหญ่ (.pt) จาก Git LFS ลงมารันด้วย

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 📦 ติดตั้งไลบรารีทั้งหมดรวมถึงระบบบอทแจ้งเตือน Telegram
        pip install ultralytics opencv-python easyocr qrcode pillow torch torchvision flask pyngrok db-sqlite3 mediapipe python-telegram-bot requests






    - name: Run Script
      run: python All4_2.py # 🚀 สั่งรันไฟล์ All4_2.py
